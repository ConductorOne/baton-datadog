name: ci
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
jobs:
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Run linters
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=3m
  go-test:
    strategy:
      matrix:
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: go tests
        run: go test -v -covermode=count -json ./... > test.json
      - name: annotate go tests
        if: always()
        uses: guyarb/golang-test-annotations@v0.6.0
        with:
          test-results: test.json
  sync-test:
    runs-on: ubuntu-latest
    env:
      BATON_LOG_LEVEL: debug
      BATON_API_KEY: ${{ secrets.BATON_API_KEY }}
      BATON_APP_KEY: ${{ secrets.BATON_APP_KEY }}
      BATON_SITE: ${{ secrets.BATON_SITE }}
      BATON_SYNC_SECRETS: true
      BATON_SYNC_SCHEDULES: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Build baton-datadog
        run: go build ./cmd/baton-datadog
      - name: Test sync
        uses: ConductorOne/github-workflows/actions/sync-test@v4
        with:
          connector: ./baton-datadog
          baton-entitlement: 'role:866c396c-2aa5-11f0-9fce-da7ad0900005:member'
          baton-principal: '867d88cb-2aa5-11f0-8e0f-0aced855af58'
          baton-principal-type: 'user'

name: ci
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
jobs:
  sync-test:
    runs-on: ubuntu-latest
    env:
      BATON_LOG_LEVEL: debug
      BATON_API_KEY: ${{ secrets.BATON_API_KEY }}
      BATON_APP_KEY: ${{ secrets.BATON_APP_KEY }}
      BATON_SITE: ${{ secrets.BATON_SITE }}
      BATON_SYNC_SECRETS: true
      BATON_SYNC_SCHEDULES: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Build baton-datadog
        run: go build ./cmd/baton-datadog
      - name: Test sync
        uses: ConductorOne/github-workflows/actions/sync-test@v4
        with:
          connector: ./baton-datadog
          baton-entitlement: 'role:32af72b4-6c01-11f1-94df-da7ad0900005:member'
          baton-principal: '41da61ff-ac62-48a3-832d-540bb01079d3'
          baton-principal-type: 'user'
          # The auth-error check intentionally invalidates BATON_* secrets.
          # Keep this feature flag parseable so it reaches authentication.
          bad-credentials: |
            BATON_SYNC_SECRETS=true
